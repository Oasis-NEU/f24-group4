<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Connect Your Google Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Qahiri&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="/src/calendar.js" defer></script>
</head>

<body>
  <p class="A">connect your google calendar!</p>
  <div class="container">
    <button id="login-button" class="button-container">click to connect!</button>
  </div>

  <!-- Next page button, initially hidden -->
  <div class="container">
    <div id="next-page-button" style="display: none;">
      <button id="go-to-next-page">go to next page</button>
    </div>
  </div>

  <!-- Script to handle the button click -->
<script>
  // Ensure the script runs after the DOM is fully loaded
  document.addEventListener('DOMContentLoaded', function() {
    const navigateButton = document.getElementById("go-to-next-page");

    // Check if the button exists before adding the event listener
    if (navigateButton) {
      navigateButton.addEventListener('click', function() {
        window.location.href = 'generate.html';
      });
    }

    // Example: Make the button visible (remove this if handled elsewhere)
    document.getElementById("next-page-button").style.display = "block";
  });
</script>

  <!-- Container to display events -->
   <div class="container">
    <div id="events-container" class="events-container"></div>
   </div>
</body>
</html>

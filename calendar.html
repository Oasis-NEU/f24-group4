<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Connect Your Google Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Qahiri&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="/src/calendar.js" defer></script>
</head>

<body>
  <p class="A">Connect your Google Calendar!</p>
  <div class="container">
    <button id="login-button" class="button-container">Click to connect!</button>
  </div>

  <!-- Generate Playlist Button -->
  <div id="playlist-container" style="display: none;">
    <button id="generate-playlist" class="button-container">Generate My Playlist</button>
  </div>

  <!-- Container to display events -->
  <div id="events-container" class="events-container"></div>

  <!-- Script to handle playlist generation -->
  <script>
    // Function to show the "Generate Playlist" button if tokens exist
    function showGeneratePlaylistButton() {
      const calendarToken = localStorage.getItem('googleCalendarAccessToken');
      const spotifyToken = localStorage.getItem('spotifyAccessToken');
  
      if (calendarToken && spotifyToken) {
        document.getElementById('playlist-container').style.display = 'block';
      }
    }
  
    // Call this function after page load
    document.addEventListener('DOMContentLoaded', showGeneratePlaylistButton);
  
    // Event listener for "Generate Playlist" button
    document.getElementById('generate-playlist').addEventListener('click', async () => {
      const calendarToken = localStorage.getItem('googleCalendarAccessToken');
      const spotifyToken = localStorage.getItem('spotifyAccessToken');
      const spotifyUserId = 'your_spotify_user_id'; // Fetch dynamically via Spotify API
  
      if (calendarToken && spotifyToken) {
        await generatePlaylist(calendarToken, spotifyToken, spotifyUserId);
      } else {
        alert('Please connect both Google Calendar and Spotify first.');
      }
    });
  
    // Main function to generate the playlist
    async function generatePlaylist(calendarToken, spotifyToken, spotifyUserId) {
      try {
        // Fetch events and analyze schedule
        const events = await listGoogleEvents(calendarToken);
        const mood = analyzeSchedule(events);
        console.log('Mood:', mood);

        // Create Spotify playlist
        const playlistId = await createSpotifyPlaylist(spotifyToken, spotifyUserId, mood);

        // Fetch tracks and add to playlist
        const tracks = await fetchTracksForMood(mood);
        await addTracksToSpotifyPlaylist(spotifyToken, playlistId, tracks);

        alert('Your playlist has been created!');
      } catch (error) {
        console.error('Error generating playlist:', error);
        alert('Something went wrong while generating your playlist.');
      }
}


async function listGoogleEvents(accessToken) {
  try {
    const today = new Date();
    const startOfDay = new Date(today.getFullYear(), today.getMonth(), today.getDate()).toISOString();
    const endOfDay = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1).toISOString();

    const response = await fetch(
      `https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&timeMin=${startOfDay}&timeMax=${endOfDay}`,
      {
        headers: {
          Authorization: `Bearer ${accessToken}`,
        },
      }
    );
    const data = await response.json();
    return data.items || [];
  } catch (error) {
    console.error('Error fetching Google Calendar events:', error);
    throw new Error('Failed to fetch events');
  }
}


  </script>
  
</body>
</html>
